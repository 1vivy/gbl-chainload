name: host-tools

on:
  push:
    paths:
      - 'crates/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'scripts/build-cross-tools.sh'
      - 'docker/**'
      - '.github/workflows/host-tools.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'scripts/build-cross-tools.sh'
      - 'docker/**'
      - '.github/workflows/host-tools.yml'
  workflow_dispatch:

concurrency:
  # Force-pushes to feature branches cancel any in-flight run.
  # Main is excluded so every commit landing on main records a full
  # CI history (never cancelled by a subsequent commit).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Build the docker image
        run: docker build -t gbl-chainload-build:latest -f docker/Dockerfile .
      - name: Cross-build the host-side tools
        run: bash scripts/build-cross-tools.sh all
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: tools-windows
          path: dist/windows
      - name: Upload macOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: tools-macos
          path: dist/macos
      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: tools-linux
          path: dist/linux

  # PR2 Task 8 collapsed the 7 host C tools into the single `gbl` multicall.
  # Smoke-test: `gbl --help` lists the 7 subcommands, and each subcommand's
  # `--help` prints its own clap usage block.
  test-windows:
    needs: cross-build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tools-windows
          path: dist/windows
      - name: Smoke-test gbl.exe + every subcommand
        shell: bash
        run: |
          set -u
          bin=dist/windows/gbl.exe
          fail=0
          # Top-level help lists all 7 subcommands.
          out=$("$bin" --help 2>&1 || true)
          for sub in commit unwrap patch pack inspect mode2 avb; do
            if printf '%s' "$out" | grep -qE "^[[:space:]]+$sub\b"; then
              echo "ok  gbl --help lists $sub"
            else
              echo "FAIL gbl --help missing $sub"
              fail=1
            fi
          done
          # Per-subcommand --help prints its own clap usage.
          for sub in commit unwrap patch pack inspect mode2 avb; do
            out=$("$bin" "$sub" --help 2>&1 || true)
            if printf '%s' "$out" | grep -qiE 'usage|options'; then
              echo "ok  gbl $sub --help"
            else
              echo "FAIL gbl $sub --help — no usage banner; output was: $out"
              fail=1
            fi
          done
          exit $fail

  test-macos:
    needs: cross-build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tools-macos
          path: dist/macos
      - name: Smoke-test gbl universal + every subcommand
        shell: bash
        run: |
          set -u
          bin=dist/macos/gbl
          chmod +x "$bin"
          fail=0
          out=$("$bin" --help 2>&1 || true)
          for sub in commit unwrap patch pack inspect mode2 avb; do
            if printf '%s' "$out" | grep -qE "^[[:space:]]+$sub\b"; then
              echo "ok  gbl --help lists $sub"
            else
              echo "FAIL gbl --help missing $sub"
              fail=1
            fi
          done
          for sub in commit unwrap patch pack inspect mode2 avb; do
            out=$("$bin" "$sub" --help 2>&1 || true)
            if printf '%s' "$out" | grep -qiE 'usage|options'; then
              echo "ok  gbl $sub --help"
            else
              echo "FAIL gbl $sub --help — no usage banner; output was: $out"
              fail=1
            fi
          done
          exit $fail

  test-linux:
    needs: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tools-linux
          path: dist/linux
      - name: Smoke-test gbl static ELF + every subcommand
        shell: bash
        run: |
          set -u
          bin=dist/linux/gbl
          chmod +x "$bin"
          fail=0
          out=$("$bin" --help 2>&1 || true)
          for sub in commit unwrap patch pack inspect mode2 avb; do
            if printf '%s' "$out" | grep -qE "^[[:space:]]+$sub\b"; then
              echo "ok  gbl --help lists $sub"
            else
              echo "FAIL gbl --help missing $sub"
              fail=1
            fi
          done
          for sub in commit unwrap patch pack inspect mode2 avb; do
            out=$("$bin" "$sub" --help 2>&1 || true)
            if printf '%s' "$out" | grep -qiE 'usage|options'; then
              echo "ok  gbl $sub --help"
            else
              echo "FAIL gbl $sub --help — no usage banner; output was: $out"
              fail=1
            fi
          done
          exit $fail
