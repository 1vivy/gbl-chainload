# tools-rs/ — Rust port of the gbl-chainload host/recovery tools (PILOT).
#
# Spike scope: gbl-commit only (see tools-rs/README.md for the migration
# assessment of gbl-pack / gblp1-inspect / mode2-profile). The C tools under
# tools/ remain the shipping implementations until a port is reviewed and
# its on-device parity proven.
[workspace]
resolver = "2"
members = ["gbl-commit"]

[workspace.package]
edition = "2021"
publish = false
license = "MIT"

[profile.release]
opt-level = 2
strip = true
