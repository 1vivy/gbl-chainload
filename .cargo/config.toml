# /.cargo/config.toml — per-target linker config.
#
# Linkers are provided by docker/Dockerfile:
#   - aarch64-linux-android: Android NDK clang (NDK r27, API 31).
#   - aarch64-unknown-uefi:  rust-lld (bundled with rustc — no config).
#   - x86_64-pc-windows-gnu: mingw-w64 GCC (native cross-compiler). zig cc
#                            doesn't accept rustc's `--disable-auto-image-base`
#                            for this target.
#   - macOS / linux-musl:    tiny zig-cc wrapper scripts (under /usr/local/bin)
#                            that pin the zig `-target` triple.

[target.aarch64-linux-android]
linker = "aarch64-linux-android31-clang"

[target.aarch64-unknown-uefi]
# rust-lld is bundled with rustc; no extra config needed.

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

[target.x86_64-apple-darwin]
linker = "/usr/local/bin/zig-cc-macos-x64"

[target.aarch64-apple-darwin]
linker = "/usr/local/bin/zig-cc-macos-arm64"

[target.x86_64-unknown-linux-musl]
# zig-cc-linux-musl bundles its own musl CRT (rcrt1.o, crti.o, crtn.o).
# Disable rustc's self-contained CRT for this target so we don't link
# both copies and trip duplicate-symbol errors on _start, _init, _fini.
linker = "/usr/local/bin/zig-cc-linux-musl"
rustflags = ["-C", "link-self-contained=no"]
